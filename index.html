<html lang="ar" dir="rtl">
<head>

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
 
    <style>
        :root {
            --bg-primary: #0d0a08;
            --bg-secondary: #16120e;
            --bg-card: #1f1914;
            --bg-card-hover: #2a221b;
            --accent-gold: #d4af37;
            --accent-gold-light: #f3e5ab;
            --accent-amber: #e58e26;
            --text-primary: #f8f5f0;
            --text-secondary: #baada0;
            --text-muted: #807265;
            --border-color: rgba(212, 175, 55, 0.2);
            --shadow-card: 0 10px 30px rgba(0, 0, 0, 0.5);
            --transition-fast: 0.25s ease;
            --transition-smooth: 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
 
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
 
        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(212, 175, 55, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(229, 142, 38, 0.05) 0%, transparent 40%);
            background-attachment: fixed;
        }
 
        /* HEADER SECTION */
        .header {
            position: relative;
            padding: 45px 20px 30px;
            text-align: center;
            background: linear-gradient(180deg, rgba(22, 18, 14, 0.95) 0%, rgba(13, 10, 8, 0.8) 100%);
            border-bottom: 1px solid var(--border-color);
            box-shadow: 0 4px 25px rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
        }
 
        .header-bg-decoration {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 800px;
            height: 100%;
            background: radial-gradient(ellipse at top, rgba(212, 175, 55, 0.15) 0%, transparent 70%);
            pointer-events: none;
        }
 
        .logo-container {
            margin-bottom: 12px;
            display: inline-block;
            position: relative;
        }
 
        .logo-icon {
            font-size: 42px;
            color: var(--accent-gold);
            filter: drop-shadow(0 0 12px rgba(212, 175, 55, 0.6));
            animation: pulseGlow 3s infinite alternate;
        }
 
        @keyframes pulseGlow {
            0% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.4)); }
            100% { transform: scale(1.05); filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.8)); }
        }
 
        .cafe-title {
            font-size: 2.6rem;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #ffffff 30%, var(--accent-gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 15px rgba(0,0,0,0.5);
            margin-bottom: 2px;
        }
 
        .cafe-slogan {
            font-size: 0.95rem;
            color: var(--accent-gold-light);
            letter-spacing: 3px;
            font-weight: 600;
            margin-bottom: 12px;
        }
 
        .location-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid var(--border-color);
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
 
        .location-badge i {
            color: var(--accent-gold);
        }
 
        /* CURRENCY SWITCHER */
        .currency-switch-wrapper {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
        }
 
        .currency-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: 600;
        }
 
        .currency-toggle {
            display: flex;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 30px;
            padding: 3px;
        }
 
        .currency-btn {
            padding: 6px 18px;
            border-radius: 25px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition-fast);
        }
 
        .currency-btn.active {
            color: #000;
            background: linear-gradient(135deg, var(--accent-gold) 0%, #e2b755 100%);
            box-shadow: 0 2px 10px rgba(212, 175, 55, 0.4);
        }
 
        /* CONTAINER */
        .container {
            max-width: 1250px;
            margin: 0 auto;
            padding: 20px 15px 80px;
        }
 
        /* SEARCH BAR */
        .search-box {
            position: relative;
            max-width: 500px;
            margin: 0 auto 25px;
        }
 
        .search-box input {
            width: 100%;
            padding: 14px 45px 14px 20px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 0.95rem;
            outline: none;
            transition: var(--transition-smooth);
        }
 
        .search-box input:focus {
            border-color: var(--accent-gold);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
            background: var(--bg-card-hover);
        }
 
        .search-box i {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--accent-gold);
            font-size: 1.1rem;
        }
 
        /* CATEGORIES SCROLL */
        .categories-scroll {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 10px 5px 20px;
            margin-bottom: 25px;
            scrollbar-width: thin;
            scrollbar-color: var(--accent-gold) var(--bg-card);
        }
 
        .cat-btn {
            white-space: nowrap;
            padding: 10px 20px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 30px;
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition-smooth);
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }
 
        .cat-btn:hover {
            background: var(--bg-card-hover);
            color: var(--text-primary);
            border-color: var(--accent-gold);
            transform: translateY(-2px);
        }
 
        .cat-btn.active {
            background: linear-gradient(135deg, var(--accent-gold) 0%, var(--accent-amber) 100%);
            color: #000;
            border-color: transparent;
            font-weight: 700;
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.35);
        }
 
        /* SECTION HEADER */
        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 30px 0 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--border-color);
            position: relative;
        }
 
        .section-header::after {
            content: '';
            position: absolute;
            bottom: -2px;
            right: 0;
            width: 80px;
            height: 2px;
            background: var(--accent-gold);
            box-shadow: 0 0 10px var(--accent-gold);
        }
 
        .section-title {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--accent-gold-light);
            display: flex;
            align-items: center;
            gap: 10px;
        }
 
        .items-count {
            font-size: 0.8rem;
            color: var(--text-muted);
            background: var(--bg-card);
            padding: 2px 10px;
            border-radius: 15px;
            border: 1px solid var(--border-color);
        }
 
        /* GRID LAYOUT */
        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }
 
        /* ITEM CARD */
        .menu-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            transition: var(--transition-smooth);
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-card);
        }
 
        .menu-card:hover {
            transform: translateY(-6px);
            border-color: var(--accent-gold);
            box-shadow: 0 12px 30px rgba(212, 175, 55, 0.25);
            background: var(--bg-card-hover);
        }
 
        .card-img-wrapper {
            position: relative;
            width: 100%;
            height: 170px;
            background: #120e0b;
            overflow: hidden;
        }
 
        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s ease;
        }
 
        .menu-card:hover .card-img {
            transform: scale(1.08);
        }
 
        .card-category-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(13, 10, 8, 0.8);
            border: 1px solid var(--border-color);
            color: var(--accent-gold-light);
            font-size: 0.7rem;
            padding: 3px 10px;
            border-radius: 20px;
            backdrop-filter: blur(4px);
            font-weight: 600;
        }
 
        .card-body {
            padding: 16px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }
 
        .card-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
        }
 
        .card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px dashed rgba(212, 175, 55, 0.15);
        }
 
        .price-tag {
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--accent-gold);
            display: flex;
            align-items: center;
            gap: 4px;
        }
 
        .price-currency {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-secondary);
        }
 
        .whatsapp-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(37, 211, 102, 0.15);
            border: 1px solid rgba(37, 211, 102, 0.3);
            color: #25D366;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition-fast);
            text-decoration: none;
        }
 
        .whatsapp-btn:hover {
            background: #25D366;
            color: #fff;
            transform: scale(1.1);
            box-shadow: 0 0 12px rgba(37, 211, 102, 0.5);
        }
 
        /* FLOATING WHATSAPP BUTTON */
        .floating-wa {
            position: fixed;
            bottom: 25px;
            left: 25px;
            background: linear-gradient(135deg, #25D366 0%, #128C7E 100%);
            color: white;
            padding: 12px 22px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 8px 25px rgba(37, 211, 102, 0.4);
            text-decoration: none;
            font-weight: 700;
            font-size: 0.9rem;
            z-index: 100;
            transition: var(--transition-smooth);
        }
 
        .floating-wa:hover {
            transform: translateY(-4px) scale(1.03);
            box-shadow: 0 12px 30px rgba(37, 211, 102, 0.6);
        }
 
        .floating-wa i { font-size: 1.3rem; }
 
        .footer {
            text-align: center;
            padding: 40px 20px;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
            margin-top: 50px;
        }
 
        .footer-logo {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--accent-gold);
            margin-bottom: 10px;
        }
 
        .footer p { color: var(--text-muted); font-size: 0.85rem; }
 
        @media (max-width: 600px) {
            .cafe-title { font-size: 2rem; }
            .items-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
            .card-img-wrapper { height: 130px; }
            .card-body { padding: 12px; }
            .card-title { font-size: 0.95rem; }
            .price-tag { font-size: 1rem; }
            .floating-wa span { display: none; }
            .floating-wa { padding: 14px; border-radius: 50%; }
        }
    </style>
</head>

        function renderMenu() {
            const container = document.getElementById('menuContainer');
            if(!container) return;
            container.innerHTML = '';
 
            const filteredItems = menuData.filter(item => {
                const matchesCategory = (currentCategory === 'all' || item.category === currentCategory);
                const matchesSearch = item.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                      item.categoryName.toLowerCase().includes(searchQuery.toLowerCase());
                return matchesCategory && matchesSearch;
            });
 
            if (filteredItems.length === 0) {
                container.innerHTML = `
                    <div style="text-align:center; padding:50px 20px; color:var(--text-muted);">
                        <i class="fa-solid fa-mug-hot" style="font-size:3rem; color:var(--accent-gold); margin-bottom:15px; opacity:0.5;"></i>

                        <p>جرب البحث عن صنف آخر أو اختر قسماً مختلفاً</p>
                    </div>
                `;
                return;
            }
 
            if (currentCategory === 'all' && searchQuery === '') {
                const categoriesMap = {};
                filteredItems.forEach(item => {
                    if (!categoriesMap[item.category]) {
                        categoriesMap[item.category] = { name: item.categoryName, items: [] };
                    }
                    categoriesMap[item.category].items.push(item);
                });
 
                for (let catKey in categoriesMap) {
                    const catObj = categoriesMap[catKey];
                    const sectionHtml = document.createElement('div');
                    sectionHtml.className = 'menu-section';
                    sectionHtml.innerHTML = `
                        <div class="section-header">
                            <h2 class="section-title"><i class="fa-solid fa-leaf"></i> ${catObj.name}</h2>
                            <span class="items-count">${catObj.items.length} أصناف</span>
                        </div>
                        <div class="items-grid">
                            ${catObj.items.map((item, index) => createCardHTML(item, index)).join('')}
                        </div>
                    `;
                    container.appendChild(sectionHtml);
                }
            } else {
                const sectionHtml = document.createElement('div');
                sectionHtml.className = 'menu-section';
                sectionHtml.innerHTML = `
                    <div class="items-grid">
                        ${filteredItems.map((item, index) => createCardHTML(item, index)).join('')}
                    </div>
                `;
                container.appendChild(sectionHtml);
            }
        }
 
        function createCardHTML(item, index) {
            const priceVal = currentCurrency === 'LT' ? item.priceLT : item.priceSYP;
            const priceSymbol = (item.priceLT === 'غير ثابت' || item.priceSYP === 'غير ثابت') ? '' : (currentCurrency === 'LT' ? 'LT' : 'ل.س');
            const waMsg = encodeURIComponent(`مرحباً Revive CAFÉ، أرغب بطلب: ${item.name} (${priceVal} ${priceSymbol})`);
 
            return `
                <div class="menu-card">
                    <div class="card-img-wrapper">
                        <img src="${item.img}" alt="${item.name}" class="card-img" onerror="this.src='${defaultImageSVG}'">
                        <span class="card-category-badge">${item.categoryName}</span>
                    </div>
                    <div class="card-body">
                        <h3 class="card-title">${item.name}</h3>
                        <div class="card-footer">
                            <div class="price-tag">
                                <span>${priceVal}</span>
                                <span class="price-currency">${priceSymbol}</span>
                            </div>
                            <a href="https://wa.me/963936335930?text=${waMsg}" class="whatsapp-btn" target="_blank" title="اطلب عبر الواتساب">
                                <i class="fa-brands fa-whatsapp"></i>
                            </a>
                        </div>
                    </div>
                </div>
            `;
        }
 
        function setCurrency(curr) {
            currentCurrency = curr;
            document.getElementById('btn-lt').classList.toggle('active', curr === 'LT');
            document.getElementById('btn-syp').classList.toggle('active', curr === 'SYP');
            renderMenu();
        }
 
        function filterCategory(cat, btn) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            if(btn) btn.classList.add('active');
            renderMenu();
        }

            searchQuery = document.getElementById('searchInput').value;
            renderMenu();
